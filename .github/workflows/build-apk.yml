name: Build Scanner APK

# Builds the LOT Scanner shell and attaches the APK to the run as a downloadable artifact.
#
# Why CI and not a laptop: neither work nor home machine has a JDK or the Android SDK, and
# installing several GB of toolchain on two laptops (and keeping them in step) is a worse
# problem than a hosted runner that already has both. Nothing here touches the PWA deploy.
#
# To get an APK: Actions -> Build Scanner APK -> Run workflow -> download `lot-scanner-apk`.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # ⛔ Signing key = identity. ANDROID_ID is scoped to the app signing key, so a build signed
      # with a different key reports a DIFFERENT device id and loses its keystore entry. Gradle
      # invents a fresh debug keystore on every runner, so a debug APK is fine for smoke-testing
      # the shell and MUST NOT go on a floor phone that we intend to identify.
      #
      # One-time setup for real builds (then this signs every build with the same key):
      #   keytool -genkeypair -v -keystore lot-scanner.jks -alias lot -keyalg RSA \
      #           -keysize 2048 -validity 10000
      #   base64 -i lot-scanner.jks | pbcopy
      # Store as repo secrets: LOT_KEYSTORE_B64, LOT_KEYSTORE_PASSWORD, LOT_KEY_ALIAS,
      # LOT_KEY_PASSWORD. Keep the .jks itself backed up off-repo — losing it means every phone
      # gets a new identity on its next update.
      - name: Decode signing keystore (if configured)
        id: sign
        env:
          KS_B64: ${{ secrets.LOT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lot-scanner.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing keystore secret set — building an UNSIGNED-for-production debug APK. Do not install this on a phone you intend to identify; see the comment in this workflow."
          fi

      # No Gradle wrapper is committed on purpose — a wrapper means a binary .jar in the repo,
      # and setup-gradle already provides Gradle. One less opaque file to trust.
      - name: Build APK
        working-directory: android
        env:
          LOT_KEYSTORE_FILE: ${{ steps.sign.outputs.configured == 'true' && format('{0}/lot-scanner.jks', runner.temp) || '' }}
          LOT_KEYSTORE_PASSWORD: ${{ secrets.LOT_KEYSTORE_PASSWORD }}
          LOT_KEY_ALIAS: ${{ secrets.LOT_KEY_ALIAS }}
          LOT_KEY_PASSWORD: ${{ secrets.LOT_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.sign.outputs.configured }}" = "true" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Name the artifact by commit
        id: v
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lot-scanner-apk-${{ steps.v.outputs.sha }}
          path: android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
